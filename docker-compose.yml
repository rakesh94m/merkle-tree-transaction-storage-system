services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["5000:5000"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      MERKLE_ANCHOR_SECRET: ${MERKLE_ANCHOR_SECRET:?set MERKLE_ANCHOR_SECRET}
      DATABASE_URL: sqlite:////data/transactions.db
    volumes: [ledger-data:/data]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  ledger-data:
